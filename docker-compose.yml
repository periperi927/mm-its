services:
  # ------------------------------------------------------------------
  # PostgreSQL Database Service
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: mmits_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmits_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env file}
      POSTGRES_DB: ${POSTGRES_DB:-mmits_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmits_user} -d ${POSTGRES_DB:-mmits_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # FastAPI Backend Service
  # ------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mmits_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PROJECT_NAME="Metro Manila Intelligent Transport System (MM-ITS)"
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in the environment or .env file}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - POSTGRES_USER=${POSTGRES_USER:-mmits_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env file}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mmits_db}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local